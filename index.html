<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login Page">
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>




<body>
  <main class="page">
    



<section class="login-card" aria-labelledby="login-title">
      <header class="login-header">
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark and light mode">◐</button>
        <h1 id="login-title">Log in</h1>
        <p class="subtitle">Enter your details below to continue.</p>
      </header>

      <form class="login-form" action="#" method="post" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
        


  <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            aria-describedby="email-error"
            required
          >
          <p class="field-error" id="email-error" role="alert"></p>
        </div>


        <div class="form-group">
          <div class="password-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>




          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              aria-describedby="password-error"
              required
            >
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <p class="field-error" id="password-error" role="alert"></p>
        </div>

        <div class="remember-row">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="login-button" id="login-button">
          <span class="button-text">Log in</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>
    </section>
  </main>

<script>
  var themeToggle = document.getElementById("theme-toggle");

  themeToggle.addEventListener("click", function () {
    var root = document.documentElement;
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  var form = document.querySelector(".login-form");
  var emailInput = document.getElementById("email");
  var passwordInput = document.getElementById("password");
  var emailError = document.getElementById("email-error");
  var passwordError = document.getElementById("password-error");

  function validateEmail() {
    if (emailInput.validity.valueMissing) {
      emailError.textContent = "Email is required.";
    } else if (emailInput.validity.typeMismatch) {
      emailError.textContent = "Enter a valid email address.";
    } else {
      emailError.textContent = "";
    }
    emailInput.classList.toggle("invalid", emailError.textContent !== "");
  }

  function validatePassword() {
    if (passwordInput.validity.valueMissing) {
      passwordError.textContent = "Password is required.";
    } else {
      passwordError.textContent = "";
    }
    passwordInput.classList.toggle("invalid", passwordError.textContent !== "");
  }

  emailInput.addEventListener("blur", validateEmail);
  passwordInput.addEventListener("blur", validatePassword);

  var toggleBtn = document.getElementById("toggle-password");

  toggleBtn.addEventListener("click", function () {
    var showing = passwordInput.type === "text";
    passwordInput.type = showing ? "password" : "text";
    toggleBtn.textContent = showing ? "Show" : "Hide";
    toggleBtn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    toggleBtn.setAttribute("aria-pressed", showing ? "false" : "true");
  });

  form.addEventListener("submit", function (e) {
    validateEmail();
    validatePassword();

    if (emailError.textContent || passwordError.textContent) {
      e.preventDefault();
      return;
    }

    // no real backend behind this demo — fake a short loading state
    e.preventDefault();
    var button = document.getElementById("login-button");
    button.disabled = true;
    button.classList.add("loading");

    setTimeout(function () {
      button.disabled = false;
      button.classList.remove("loading");
    }, 1500);
  });
</script>
</body>
</html>
